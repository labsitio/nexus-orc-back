allowBuilds:
  esbuild: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@aws-sdk/client-eventbridge@3.1099.0'
  - '@aws-sdk/s3-request-presigner@3.1099.0'
  - '@aws-sdk/client-dynamodb@3.1099.0'
  - '@aws-sdk/lib-dynamodb@3.1099.0'

# GHSA-67mh-4wv8-2f99 (esbuild <= 0.24.2): drizzle-kit depende do
# @esbuild-kit/esm-loader, deprecado ("merged into tsx") e preso ao
# esbuild 0.18.x, embora o próprio drizzle-kit já dependa de tsx e de
# esbuild ^0.25.4. Sobe só esse ramo transitivo para a linha corrigida.
# Remover quando drizzle-kit largar @esbuild-kit (0.31.10 é a última).
overrides:
  '@esbuild-kit/core-utils>esbuild': '^0.25.0'
  # GHSA-2v37-7h3g-55p8 (nanoid < 3.3.18): geradores customizados entram em
  # loop infinito quando o tamanho é zero. `^3.3.17` (override anterior,
  # #705) ainda resolvia para a versão vulnerável — o advisory foi
  # atualizado depois para cobrir também 3.3.17. Chega por 6 caminhos
  # transitivos, todos via postcss sob vite/vitest (`@vitest/coverage-v8`,
  # `allure-vitest`). Nenhum é dependência direta nossa. `^3.3.18` fica
  # dentro do `^3.3.6` que o postcss pede. Remover quando a cadeia
  # vite/vitest subir sozinha.
  'nanoid': '^3.3.18'
