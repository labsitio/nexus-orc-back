name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck (tsc --strict)
        run: pnpm run typecheck

      - name: Typecheck infra (CDK)
        run: pnpm run typecheck:infra

      - name: CDK synth (smoke test)
        run: pnpm exec cdk synth --quiet

      - name: Test
        run: pnpm run test

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
