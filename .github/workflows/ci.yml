name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Postgres real para os testes de integração de schema/migração
      # (specs/001-ingestao-classificacao-orcamentos, T010) — mesmas
      # credenciais do docker-compose.yml local.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexo
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexo:nexo@localhost:5432/nexo
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck (tsc --strict)
        run: pnpm run typecheck

      - name: Typecheck infra (CDK)
        run: pnpm run typecheck:infra

      - name: CDK synth (smoke test)
        run: pnpm exec cdk synth --quiet

      - name: Migrar schema (Postgres do serviço CI)
        run: pnpm run db:migrate

      - name: Test
        run: pnpm run test

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
